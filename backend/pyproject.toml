[project]
name = "answersheetevaluator"
version = "0.1.0"
description = "Automated Answer Sheet Evaluator — OCR + RAG + LLM grading pipeline"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",  # file upload support
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",        # async SQLite driver
    # Config / Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Logging
    "structlog>=24.2.0",
    # HTTP
    "httpx>=0.27.0",
    "google-genai>=2.10.0",
    "protobuf==3.20.3",
    "pypdf>=6.16.1",
]

[project.optional-dependencies]
ocr = [
    "opencv-python>=4.10.0",
    "Pillow>=10.4.0",
    "pdf2image>=1.17.0",         # PDF → images via poppler
    "google-cloud-vision>=3.7.0",
]

rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.40.0",           # for text-embedding-3-small
]

llm = [
    "litellm>=1.43.0",          # provider-agnostic LLM calls
]

dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # TestClient transport
    "ruff>=0.5.0",              # linter + formatter
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*httpx.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["tests/*", "scripts/*"]
